name: Radar de licitaciones

on:
  schedule:
    # GitHub Actions programa en UTC; Chile alterna UTC-4 / UTC-3.
    # Se dispara en los dos horarios posibles y pipeline/ventana.py deja pasar
    # solo el que corresponde a lunes 11:00 y miercoles 21:00 hora de Santiago.
    - cron: '0 14,15 * * 1'
    - cron: '0 0,1 * * 4'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Correr aunque no sea la ventana horaria'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar-licitaciones
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar ventana horaria
        id: ventana
        env:
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forzar }}
        run: python pipeline/ventana.py

      - name: Diagnostico de configuracion
        run: |
          echo "Credenciales cargadas (solo indica si existen, nunca su valor):"
          [ -n "${{ secrets.MP_TICKET }}" ]        && echo "  MP_TICKET.......... si (propio)" || echo "  MP_TICKET.......... NO -> se usa el ticket publico, con rate limit agresivo"
          [ -n "${{ secrets.CALLMEBOT_APIKEY }}" ] && echo "  CALLMEBOT_APIKEY... si" || echo "  CALLMEBOT_APIKEY... NO -> no habra aviso por WhatsApp"
          [ -n "${{ secrets.WHATSAPP_PHONE }}" ]   && echo "  WHATSAPP_PHONE..... si" || echo "  WHATSAPP_PHONE..... NO"
          [ -n "${{ secrets.RESEND_API_KEY }}" ]   && echo "  RESEND_API_KEY..... si" || echo "  RESEND_API_KEY..... NO -> no se enviara el Excel por correo"
          echo "  PAGES_URL.......... ${{ vars.PAGES_URL || '(sin variable, se usa el valor por defecto)' }}"

      - name: Barrer Mercado Publico
        id: barrido
        if: steps.ventana.outputs.correr == 'true'
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          MP_DATA: ${{ github.workspace }}/data
        run: |
          set -o pipefail   # sin esto, un crash de scan.py queda enmascarado por tee
          # El ritmo depende del ticket: el propio tiene cuota de 10.000 consultas diarias
          # y tolera ir rapido; el publico de demostracion es compartido y obliga a frenar.
          # Se decide aqui para que quitar el secret no rompa nada: degrada solo.
          if [ -n "$MP_TICKET" ]; then
            PAUSA=0.15; echo "Ticket propio: barrido rapido (pausa ${PAUSA}s)."
          else
            PAUSA=0.6;  echo "::warning::Sin MP_TICKET: se usa el ticket publico, mas lento y con 429."
          fi
          exito=0
          for i in 1 2 3 4 5; do
            echo "::group::Tanda $i"
            if python pipeline/scan.py --min-rm 500 --min-nacional 2000 --min-dias 1 \
                 --pausa "$PAUSA" --presupuesto 420 | tee /tmp/scan.log; then
              exito=1
              echo "::endgroup::"
              if grep -q "pendientes tras la tanda: 0" /tmp/scan.log; then
                echo "Sin pendientes: barrido completo en $i tanda(s)."
                break
              fi
              echo "Quedan detalles pendientes; nueva tanda."
            else
              exito=0
              echo "::endgroup::"
              echo "::warning::La tanda $i fallo. Reintento en 30s."
              sleep 30
            fi
          done
          if [ "$exito" != "1" ]; then
            echo "::error::El barrido no pudo completarse. NO se publica nada: se conserva"
            echo "::error::el dashboard y el historico de la corrida anterior."
            exit 1
          fi

      - name: Generar entregables
        if: steps.ventana.outputs.correr == 'true'
        env:
          MP_DATA: ${{ github.workspace }}/data
          MP_OUT: ${{ github.workspace }}/salidas
        run: python pipeline/run.py

      - name: Publicar en chilecompra.gamma-re.com
        id: publicar
        if: steps.ventana.outputs.correr == 'true'
        env:
          PAGES_URL: ${{ vars.PAGES_URL || 'https://chilecompra.gamma-re.com' }}
          MP_OUT: ${{ github.workspace }}/salidas
        run: python pipeline/publicar.py

      - name: Enviar Excel de respaldo por correo
        id: correo
        if: steps.ventana.outputs.correr == 'true'
        continue-on-error: true   # el aviso es el ultimo tramo: si falla, el dashboard ya quedo publicado
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DESTINO: ${{ vars.EMAIL_DESTINO || 'luisfelipe@realsachile.com' }}
          EMAIL_REMITENTE: ${{ vars.EMAIL_REMITENTE || 'Radar de Licitaciones <radar@envios.gamma-re.com>' }}
          PAGES_URL: ${{ vars.PAGES_URL || 'https://chilecompra.gamma-re.com' }}
          MP_OUT: ${{ github.workspace }}/salidas
          MP_DATA: ${{ github.workspace }}/data
        run: python pipeline/enviar_correo.py

      - name: Guardar historico y dashboard en el repo
        if: steps.ventana.outputs.correr == 'true'
        run: |
          git config user.name  "radar-licitaciones"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Radar $(date -u +%Y-%m-%d): historico y dashboard"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          if ! git push; then
            echo "::error::No se pudo escribir en el repositorio. Casi siempre es el permiso del token:"
            echo "::error::Settings -> Actions -> General -> Workflow permissions -> 'Read and write permissions' -> Save."
            echo "::error::Sin esto el historico no se guarda y cada corrida marcaria todo como NUEVA."
            exit 1
          fi

      - name: Avisar por WhatsApp
        id: whatsapp
        if: steps.ventana.outputs.correr == 'true'
        continue-on-error: true
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python pipeline/notificar.py "$(cat aviso.txt)"

      - name: Resumen de la corrida
        if: always() && steps.ventana.outputs.correr == 'true'
        run: |
          {
            echo "## Resultado de la corrida"
            echo ""
            echo "| Paso | Estado |"
            echo "|---|---|"
            echo "| Barrido de Mercado Publico | ${{ steps.barrido.outcome || 'ver arriba' }} |"
            echo "| Publicacion del dashboard | ${{ steps.publicar.outcome || 'ver arriba' }} |"
            echo "| Envio del Excel por correo | ${{ steps.correo.outcome }} |"
            echo "| Aviso por WhatsApp | ${{ steps.whatsapp.outcome }} |"
            echo ""
            echo "Dashboard: ${{ vars.PAGES_URL || 'https://chilecompra.gamma-re.com' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Adjuntar entregables a la ejecucion
        if: steps.ventana.outputs.correr == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: entregables
          path: salidas/
          retention-days: 90
